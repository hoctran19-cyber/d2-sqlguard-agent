name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      # Temporary exception for two legacy Task 6E BIRD files; format checks remain enabled elsewhere.
      - run: ruff format --check . --exclude evaluation/bird_pilot.py --exclude tests/unit/test_bird_pilot.py
      - run: pytest -q
